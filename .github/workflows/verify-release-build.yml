# TEMPORARY: generated from tagpr.yml to verify the package build jobs. Remove before merge.
name: verify-release-build
on:
  push:
    branches:
      - goreleaser-v2

jobs:
  ubuntu-amd64:
    name: Build packages on Ubuntu amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag HEAD locally (never pushed)
        run: git tag v0.23.12

      - name: Build
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            uname -a

            apt-get -qq update
            apt-get install -qq gcc g++ make debhelper dh-make clang git curl devscripts fakeroot byacc bison flex libpcap-dev
            git config --global --add safe.directory $WORKSPACE

            export LIBPCAP_FILE=libpcap-$LIBPCAP_VERSION.tar.gz
            export LIBPCAP_URL=https://www.tcpdump.org/release/$LIBPCAP_FILE
            export GO_FILE=go$GO_VERSION.linux-amd64.tar.gz
            export GO_URL=https://go.dev/dl/$GO_FILE
            export GOPATH=/go
            export PATH=$GOPATH/bin:/usr/local/go/bin:$PATH
            curl -OL $GO_URL
            tar -C /usr/local -xzf $GO_FILE
            rm $GO_FILE
            curl -OL $LIBPCAP_URL
            tar -C /usr/local/src -xzf $LIBPCAP_FILE
            rm $LIBPCAP_FILE

            mkdir -p $GOPATH/src $GOPATH/bin
            chmod -R 777 $GOPATH
            go version

            echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | tee /etc/apt/sources.list.d/goreleaser.list
            apt-get -qq update
            # Pin an exact version instead of floating, because a new major already broke this job once
            # and the configs in .goreleaser/ need v2.8 or later (ids).
            apt-get install -qq goreleaser=2.20.2
            goreleaser -v
            goreleaser release --config .goreleaser/deb_amd64.yml --clean --skip=publish
          image: ubuntu:latest
          platform: linux/amd64
          args: '--env LIBPCAP_VERSION --env GO_VERSION'
        env:
          GO_VERSION: 1.22.1
          LIBPCAP_VERSION: 1.10.4

      - name: Check dist/
        run: ls dist/

      - name: Install test
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            apt-get -qq update
            apt-get install -qq libpcap0.8
            dpkg -i dist/tcpdp*.deb
            tcpdp version
          image: ubuntu:latest
          platform: linux/amd64

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist-deb-amd64
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/checksums*

