  centos-amd64:
    name: Build packages on CentOS amd64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag HEAD locally (never pushed)
        run: git tag v0.23.12

      - name: Build
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            uname -a

            # CentOS 7 is EOL and mirrorlist.centos.org is gone, so use the frozen vault.centos.org instead.
            sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's/^#[[:space:]]*baseurl=/baseurl=/' -e 's#http://mirror.centos.org/centos/\(\$releasever\|7\)/#https://vault.centos.org/centos/7.9.2009/#' /etc/yum.repos.d/CentOS-*.repo
            yum install -y epel-release make clang glibc glibc-static gcc byacc flex libpcap-devel
            yum remove git*
            yum install -y https://packages.endpointdev.com/rhel/7/os/x86_64/endpoint-repo.x86_64.rpm
            yum install -y git

            git config --global --add safe.directory $WORKSPACE

            export LIBPCAP_FILE=libpcap-$LIBPCAP_VERSION.tar.gz
            export LIBPCAP_URL=https://www.tcpdump.org/release/$LIBPCAP_FILE
            export GO_FILE=go$GO_VERSION.linux-amd64.tar.gz
            export GO_URL=https://go.dev/dl/$GO_FILE
            export GOPATH=/go
            export PATH=$GOPATH/bin:/usr/local/go/bin:$PATH
            curl -OL $GO_URL
            tar -C /usr/local -xzf $GO_FILE
            rm $GO_FILE
            curl -OL $LIBPCAP_URL
            tar -C /usr/local/src -xzf $LIBPCAP_FILE
            rm $LIBPCAP_FILE

            mkdir -p $GOPATH/src $GOPATH/bin
            chmod -R 777 $GOPATH
            go version

            echo '[goreleaser]
            name=GoReleaser
            baseurl=https://repo.goreleaser.com/yum/
            enabled=1
            gpgcheck=0' | tee /etc/yum.repos.d/goreleaser.repo
            # Pin an exact version instead of floating, because a new major already broke this job once
            # and the configs in .goreleaser/ need v2.8 or later (ids).
            yum install -y goreleaser-2.20.2
            goreleaser -v
            goreleaser release --config .goreleaser/rpm_amd64.yml --clean --skip=publish
          image: centos:7
          platform: linux/amd64
          args: '--env LIBPCAP_VERSION --env GO_VERSION'
        env:
          GO_VERSION: 1.22.1
          LIBPCAP_VERSION: 1.10.4

      - name: Check dist/
        run: ls dist/

      - name: Install test
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            # CentOS 7 is EOL and mirrorlist.centos.org is gone, so use the frozen vault.centos.org instead.
            sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's/^#[[:space:]]*baseurl=/baseurl=/' -e 's#http://mirror.centos.org/centos/\(\$releasever\|7\)/#https://vault.centos.org/centos/7.9.2009/#' /etc/yum.repos.d/CentOS-*.repo
            yum install -y dist/tcpdp*.rpm
            tcpdp version
          image: centos:7
          platform: linux/amd64

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist-rpm-amd64
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/checksums*

  centos-arm64:
    name: Build packages on CentOS arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag HEAD locally (never pushed)
        run: git tag v0.23.12

      - name: Build
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            uname -a

            # CentOS 7 is EOL and mirrorlist.centos.org is gone, so use the frozen vault.centos.org instead.
            sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's/^#[[:space:]]*baseurl=/baseurl=/' -e 's#http://mirror.centos.org/\(centos\|altarch\)/\(\$releasever\|7\)/#https://vault.centos.org/altarch/7.9.2009/#' /etc/yum.repos.d/CentOS-*.repo
            yum install -y epel-release make clang glibc glibc-static gcc byacc flex libpcap-devel
            yum remove git*
            yum -y install epel-release centos-release-scl
            # centos-release-scl adds repo files that still point to the mirrorlist.
            sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's/^#[[:space:]]*baseurl=/baseurl=/' -e 's#http://mirror.centos.org/\(centos\|altarch\)/\(\$releasever\|7\)/#https://vault.centos.org/altarch/7.9.2009/#' /etc/yum.repos.d/CentOS-*.repo
            yum -y groupinstall "Development Tools"
            yum -y install wget perl-CPAN gettext-devel perl-devel openssl-devel zlib-devel curl curl-devel expat-devel getopt asciidoc xmlto docbook2X devtoolset-10
            ln -s /usr/bin/db2x_docbook2texi /usr/bin/docbook2x-texi
            export GIT_VER="v2.44.0"
            wget https://github.com/git/git/archive/${GIT_VER}.tar.gz
            tar -xvf ${GIT_VER}.tar.gz
            rm -f ${GIT_VER}.tar.gz
            cd git-*
            scl enable devtoolset-10 'make configure && ./configure --prefix=/usr && make && make install'
            cd $WORKSPACE
            rm -rf git-*
            git config --global --add safe.directory $WORKSPACE

            export LIBPCAP_FILE=libpcap-$LIBPCAP_VERSION.tar.gz
            export LIBPCAP_URL=https://www.tcpdump.org/release/$LIBPCAP_FILE
            export GO_FILE=go$GO_VERSION.linux-arm64.tar.gz
            export GO_URL=https://go.dev/dl/$GO_FILE
            export GOPATH=/go
            export PATH=$GOPATH/bin:/usr/local/go/bin:$PATH
            curl -OL $GO_URL
            tar -C /usr/local -xzf $GO_FILE
            rm $GO_FILE
            curl -OL $LIBPCAP_URL
            tar -C /usr/local/src -xzf $LIBPCAP_FILE
            rm $LIBPCAP_FILE

            mkdir -p $GOPATH/src $GOPATH/bin
            chmod -R 777 $GOPATH
            go version

            echo '[goreleaser]
            name=GoReleaser
            baseurl=https://repo.goreleaser.com/yum/
            enabled=1
            gpgcheck=0' | tee /etc/yum.repos.d/goreleaser.repo
            # Pin an exact version instead of floating, because a new major already broke this job once
            # and the configs in .goreleaser/ need v2.8 or later (ids).
            yum install -y goreleaser-2.20.2
            goreleaser -v
            goreleaser release --config .goreleaser/rpm_arm64.yml --clean --skip=publish
          image: centos:7
          platform: linux/arm64
          args: '--env LIBPCAP_VERSION --env GO_VERSION'
        env:
          GO_VERSION: 1.22.1
          LIBPCAP_VERSION: 1.10.4

      - name: Check dist/
        run: ls dist/

      - name: Install test
        uses: k1LoW/run-on-container@v1
        with:
          run: |
            # CentOS 7 is EOL and mirrorlist.centos.org is gone, so use the frozen vault.centos.org instead.
            sed -i -e 's/^mirrorlist=/#mirrorlist=/' -e 's/^#[[:space:]]*baseurl=/baseurl=/' -e 's#http://mirror.centos.org/\(centos\|altarch\)/\(\$releasever\|7\)/#https://vault.centos.org/altarch/7.9.2009/#' /etc/yum.repos.d/CentOS-*.repo
            yum install -y dist/tcpdp*.rpm
            tcpdp version
          image: centos:7
          platform: linux/arm64

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist-rpm-rpm64
          path: |
            dist/*.rpm
            dist/*.tar.gz
            dist/checksums*
  release:
    runs-on: ubuntu-latest
    needs:
      - ubuntu-amd64
      - ubuntu-arm64
      - centos-amd64
      - centos-arm64
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: merged-artifacts
          pattern: dist-*
          delete-merged: true
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: merged-artifacts
          path: dist/
      - name: Check dist/
        run: ls dist/
